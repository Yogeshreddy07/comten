<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Comten Reports</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    window.ROOT = '.';
  </script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="card login-card">
      <img class="brand-mark" src="assets/images/comten-logo.png" alt="Comten logo">
      <h1>Comten Reports</h1>
      <p class="sub">Sign in with your employee code or email ID.</p>
      <div id="error" class="error-box" role="alert"></div>
      <form id="login-form">
        <label>
          Employee code or email ID
          <input id="identifier" type="text" autocomplete="username" required autofocus>
        </label>
        <label>
          Password
          <div class="password-field">
            <input id="password" type="password" autocomplete="current-password" required>
            <button type="button" id="password-toggle" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></button>
          </div>
        </label>
        <button class="primary" id="submit" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Already signed in? Straight to the dashboard.
      const existing = window.auth.session();
      if (existing && existing.token && window.auth.isAllowedRole(existing.role)) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('error');
      const submit = document.getElementById('submit');

      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('password-toggle');
      // Same "visibility" / "visibility_off" glyphs used for the password
      // field's suffix icon in the app (see AuthTextField).
      const ICON_VISIBILITY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>';
      const ICON_VISIBILITY_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6c3.79 0 7.17 2.13 8.82 5.5-.59 1.22-1.42 2.27-2.4 3.12l1.41 1.41c1.39-1.23 2.49-2.77 3.18-4.53C21.27 7.11 17 4 12 4c-1.27 0-2.49.2-3.64.57l1.65 1.65C10.66 6.09 11.32 6 12 6zm-1.07 1.14L13 9.21c.57.25 1.03.71 1.28 1.28l2.07 2.07c.08-.34.13-.7.13-1.07 0-2.21-1.79-4-4-4-.37 0-.72.05-1.07.13zM2 3.27l2.28 2.28C3.61 6.4 2.35 7.9 1.5 9.5c1.65 3.87 5.03 6.5 8.82 6.5.98 0 1.93-.19 2.81-.53l3.14 3.14 1.41-1.41L3.41 1.86 2 3.27zM7.53 9.8l1.55 1.55c-.05.21-.08.42-.08.65 0 1.66 1.34 3 3 3 .23 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/></svg>';
      passwordToggle.addEventListener('click', function () {
        const showing = passwordInput.type === 'text';
        passwordInput.type = showing ? 'password' : 'text';
        passwordToggle.innerHTML = showing ? ICON_VISIBILITY : ICON_VISIBILITY_OFF;
        passwordToggle.setAttribute('aria-pressed', String(!showing));
        passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        passwordToggle.title = showing ? 'Show password' : 'Hide password';
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        errorBox.classList.remove('show');
        submit.disabled = true;
        submit.textContent = 'Signing in…';
        try {
          await window.auth.login(
            document.getElementById('identifier').value.trim(),
            document.getElementById('password').value
          );
          window.location.href = 'dashboard.html';
        } catch (e) {
          errorBox.textContent = e.message || 'Login failed';
          errorBox.classList.add('show');
          submit.disabled = false;
          submit.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
